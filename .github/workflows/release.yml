name: release

# Build the Windows executable and attach it to a GitHub release.
#
# The decoder is a dependency, so it is built here from source rather than
# downloaded, and the packaged program is tested as an artefact before it is
# published. That is the point of the whole job: the checks that run against
# the Python modules all passed while the frozen build was quietly unable to
# stop a decode, because the only thing that reproduces it is the frozen build.
#
# Pushing a v* tag is what starts this. workflow_dispatch rebuilds an existing
# tag.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: existing tag to build a release for
        required: true

permissions:
  contents: write

jobs:
  windows:
    name: windows x64
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check out the requested tag
        if: github.event_name == 'workflow_dispatch'
        run: git fetch --tags && git checkout "${{ inputs.tag }}"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          # make is not in base-devel here; without it the decoder build exits
          # 127 on a command that is nowhere to be found
          install: >-
            base-devel
            make
            mingw-w64-x86_64-gcc

      # Clone and build the decoder from the normal windows shell, where git
      # and python already are. The msys2 shell is only entered for make, so
      # it needs nothing beyond a compiler and make.
      - name: Fetch the decoder
        run: git clone --depth 1 https://github.com/prof-abdo/tsdec.git _decoder

      - name: Build the decoder
        shell: msys2 {0}
        # No test here: the decoder's own workflow already runs its suite on
        # every platform, and repeating it in a packaging job only means
        # debugging two toolchains instead of one. What this job has to prove
        # is about the front end.
        run: make -C _decoder

      # ---- the front end ----
      - name: Install the build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install PySide6 pyinstaller

      - name: Test the window
        env:
          TSDEC_BIN: ${{ github.workspace }}/_decoder/tsdec.exe
          TSDEC_SRC: ${{ github.workspace }}/_decoder
          QT_QPA_PLATFORM: offscreen
        run: python test_qt.py

      - name: Build the executable
        env:
          TSDEC_BIN: ${{ github.workspace }}/_decoder/tsdec.exe
        run: python -m PyInstaller --noconfirm --clean tsdec_gui.spec

      # The decoder that gets embedded is the one just built, not whatever was
      # on the machine, so the release and the test are the same program.
      - name: Test the packaged executable
        env:
          TSDEC_SRC: ${{ github.workspace }}/_decoder
        run: python test_exe.py

      - name: Package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path dist-package | Out-Null
          Copy-Item dist/tsdec-gui.exe dist-package/
          Copy-Item README.md, CHANGELOG.md, LICENSE dist-package/
          Compress-Archive -Path dist-package/* -DestinationPath tsdec-gui-windows-x86_64.zip -Force
          Get-Item tsdec-gui-windows-x86_64.zip | Format-List Name,Length

      - name: Attach to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          generate_release_notes: true
          draft: true
          files: |
            tsdec-gui-windows-x86_64.zip
            dist/tsdec-gui.exe

  other:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Check out the requested tag
        if: github.event_name == 'workflow_dispatch'
        run: git fetch --tags && git checkout "${{ inputs.tag }}"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch and build the decoder
        run: |
          git clone --depth 1 https://github.com/prof-abdo/tsdec.git _decoder
          make -C _decoder

      # Qt loads libEGL even on the offscreen platform plugin, so a bare runner
      # has to be given it or the test dies on an import before it starts
      - name: System libraries Qt needs
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3
        if: matrix.os == 'ubuntu-latest'

      - name: Install the build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install PySide6

      # There is no native build for these two yet, so what is checked here is
      # that the code runs, and the packaging for them is left to whoever wants
      # a linux or mac build. Running the test suite is still worth it: a
      # mistake that only shows up on a non windows platform belongs here and
      # nowhere else.
      - name: Test the window
        env:
          TSDEC_BIN: ${{ github.workspace }}/_decoder/tsdec
          TSDEC_SRC: ${{ github.workspace }}/_decoder
          QT_QPA_PLATFORM: offscreen
        run: python test_qt.py
